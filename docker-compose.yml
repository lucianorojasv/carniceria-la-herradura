services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carniceria}
      POSTGRES_USER: ${POSTGRES_USER:-carniceria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carniceria123}
      TZ: America/Lima
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carniceria} -d ${POSTGRES_DB:-carniceria}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-carniceria}
      DB_USER: ${POSTGRES_USER:-carniceria}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-carniceria123}
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-carniceria}
      FLYWAY_USER: ${POSTGRES_USER:-carniceria}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-carniceria123}
      FLYWAY_ENABLED: "true"
      JPA_DDL_AUTO: validate
      DB_POOL_MAX_SIZE: 5
      JWT_SECRET: ${JWT_SECRET:-CAMBIAR_ESTA_CLAVE_SUPER_SEGURA_DE_64_CARACTERES_LA_HERRADURA_2026}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost,http://localhost:3000,http://localhost:5173}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-v23.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-la-herradura-webhook}
      OPENAI_ENABLED: ${OPENAI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      TZ: America/Lima
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    profiles: ["automation"]
    environment:
      GENERIC_TIMEZONE: America/Lima
      TZ: America/Lima
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-cambiar-esta-clave}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"
    restart: unless-stopped

volumes:
  postgres_data:
  n8n_data:
